<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E893AC">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Aplicativo pessoal de treinos, progresso e motivação.">
<title>Clarinha's Personal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#screen">Pular para o conteúdo principal</a>
<div id="app"><div class="loading-wrap">carregando... 🌸</div></div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="restTimerBar" class="rest-bar" role="timer" aria-live="polite"></div>
<input type="file" id="photoUploadInput" class="visually-hidden" accept="image/png,image/jpeg,image/webp" onchange="handlePhotoFileSelected(this)">
<div id="spotifyMiniPlayer" class="spotify-bar" aria-label="Controles do Spotify"></div>

<script src="clarinha-local-storage.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script>
</body>
</html>
